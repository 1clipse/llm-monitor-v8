services:
  backend:
    build: ./backend
    container_name: llm-monitor-v8-backend
    environment:
      DATABASE_URL: sqlite:////app/data/llm_monitor.db
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTH_ENABLED: "false"
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: llm-monitor-v8-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

